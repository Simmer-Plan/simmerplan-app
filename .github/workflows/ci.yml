# PR quality gate for simmerplan-app (SIM-38). Runs lint, typecheck, tests and
# a bundle smoke-test on PRs to and pushes on development/main. typecheck/test
# use `-r --if-present` so packages are picked up as those scripts are added.
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @simmerplan/types build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: Build (esbuild bundle smoke test)
        run: pnpm --filter @simmerplan/api build
